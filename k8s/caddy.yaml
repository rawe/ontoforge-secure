# Caddy auth gateway — the only component the Ingress routes to.
#
# Caddy serves plain HTTP on port 80. TLS is terminated by the Ingress
# (see ingress.yaml), so Caddy is stateless: no volume, any replica count.
#
# DevOps checklist:
#   1. FRONTEND_HOST / API_HOST below = the two public hostnames (no scheme).
#   2. Secret `caddy-auth` exists (BASIC_AUTH_USER, BASIC_AUTH_HASH, ONTOFORGE_API_TOKEN).
#   3. Nothing but this Service is referenced by an Ingress.
apiVersion: v1
kind: Service
metadata:
  name: caddy
spec:
  type: ClusterIP
  selector:
    app: caddy
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: caddy
spec:
  replicas: 2
  selector:
    matchLabels:
      app: caddy
  template:
    metadata:
      labels:
        app: caddy
    spec:
      containers:
        - name: caddy
          image: caddy:2.11
          ports:
            - name: http
              containerPort: 80
            - name: health
              containerPort: 8080
          env:
            - name: FRONTEND_HOST
              value: ontoforge.example.com
            - name: API_HOST
              value: api.ontoforge.example.com
            - name: SERVER_UPSTREAM
              value: ontoforge-server:8000
            - name: UI_UPSTREAM
              value: ontoforge-ui:80
          envFrom:
            # BASIC_AUTH_USER, BASIC_AUTH_HASH, ONTOFORGE_API_TOKEN
            - secretRef:
                name: caddy-auth
          volumeMounts:
            - name: caddyfile
              mountPath: /etc/caddy/Caddyfile
              subPath: Caddyfile
              readOnly: true
          readinessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: health
            periodSeconds: 30
      volumes:
        - name: caddyfile
          configMap:
            name: caddy-config
