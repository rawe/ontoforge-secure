# Reference manifests for the Caddy auth gateway in front of OntoForge.
# Build with:
#   kubectl kustomize --load-restrictor LoadRestrictionsNone k8s/ | kubectl apply -f -
# (the flag allows reading ../caddy/Caddyfile from outside this directory)
# The Caddyfile is the SAME file the compose PoC uses — one source of truth.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: ontoforge

resources:
  - namespace.yaml
  - postgres.yaml
  - ontoforge-server.yaml
  - ontoforge-ui.yaml
  - caddy.yaml
  - networkpolicy.yaml

configMapGenerator:
  - name: caddy-config
    files:
      - Caddyfile=../caddy/Caddyfile

# Secrets are NOT generated here. Create them out-of-band, e.g.:
#   kubectl -n ontoforge create secret generic caddy-auth \
#     --from-literal=BASIC_AUTH_USER=admin \
#     --from-literal=BASIC_AUTH_HASH="$(scripts/hash-password.sh --raw)" \
#     --from-literal=ONTOFORGE_API_TOKEN="$(scripts/gen-token.sh --raw)"
#   kubectl -n ontoforge create secret generic ontoforge-db \
#     --from-literal=POSTGRES_PASSWORD='...'
#   kubectl -n ontoforge create secret generic ontoforge-server-env \
#     --from-env-file=env/ontoforge.env --from-env-file=env/ontoforge.local.env
# See secrets.example.yaml and docs/kubernetes.md.
