# EXAMPLE ONLY — never commit real values. Prefer `kubectl create secret`
# or your secret manager (External Secrets, Sealed Secrets, Vault, ...).
apiVersion: v1
kind: Secret
metadata:
  name: caddy-auth
  namespace: ontoforge
type: Opaque
stringData:
  BASIC_AUTH_USER: admin
  # bcrypt hash from `scripts/hash-password.sh --raw` (raw, single `$`)
  BASIC_AUTH_HASH: "$2a$14$REPLACE_ME"
  # from `scripts/gen-token.sh --raw`
  ONTOFORGE_API_TOKEN: REPLACE_ME
---
apiVersion: v1
kind: Secret
metadata:
  name: ontoforge-db
  namespace: ontoforge
type: Opaque
stringData:
  POSTGRES_PASSWORD: REPLACE_ME
---
# OntoForge feature settings (embeddings / AI). Create it from the same env
# files compose uses:
#   kubectl create secret generic ontoforge-server-env \
#     --from-env-file=env/ontoforge.env --from-env-file=env/ontoforge.local.env
apiVersion: v1
kind: Secret
metadata:
  name: ontoforge-server-env
  namespace: ontoforge
type: Opaque
stringData:
  EMBEDDING_PROVIDER: ""
  EMBEDDING_MODEL: ""
  EMBEDDING_BASE_URL: ""
  EMBEDDING_API_KEY: ""
  EMBEDDING_DIMENSIONS: ""
  DOCUMENT_CHUNK_SIZE: ""
  DOCUMENT_CHUNK_OVERLAP: ""
  AI_PROVIDER: ""
  AI_MODEL: ""
  AI_BASE_URL: ""
  AI_API_KEY: ""
  AI_REASONING_EFFORT: ""
