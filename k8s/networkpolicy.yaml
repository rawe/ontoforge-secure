# Defence in depth: even inside the cluster, only Caddy may talk to the UI
# and the server, and only the server may talk to PostgreSQL. This is the
# Kubernetes equivalent of the `internal: true` network in the compose PoC.
# Requires a CNI that enforces NetworkPolicy (Calico, Cilium, ...).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ontoforge-server-from-caddy-only
spec:
  podSelector:
    matchLabels:
      app: ontoforge-server
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: caddy
      ports:
        - port: 8000
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: ontoforge-ui-from-caddy-only
spec:
  podSelector:
    matchLabels:
      app: ontoforge-ui
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: caddy
      ports:
        - port: 80
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-from-server-only
spec:
  podSelector:
    matchLabels:
      app: postgres
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ontoforge-server
      ports:
        - port: 5432
